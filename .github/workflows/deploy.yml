name: DevSecOps Full Pipeline - React Firebase

on:
  push:
    branches: ["dev"]
  pull_request:

env:
  IMAGE_NAME: duolingo-mobelite
  IMAGE_TAG: latest

jobs:

# =====================================================
# SAST - SONARQUBE (LOCAL - SELF HOSTED RUNNER)
# =====================================================
  sonarqube:
    name: SAST - SonarQube
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: SonarQube Scan (Docker)
        shell: powershell
        run: docker run --rm -e SONAR_HOST_URL="http://host.docker.internal:9000" -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" -v ${PWD}:/usr/src sonarsource/sonar-scanner-cli
# =====================================================
# BUILD & PUSH DOCKER IMAGE
# =====================================================
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


# =====================================================
# SCA - TRIVY (IMAGE SCAN)
# =====================================================
  trivy:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/duolingo-mobelite:latest
          format: json
          output: trivy.json
        continue-on-error: true
      - name: Debug files
        run: ls -R
      - name: Upload Trivy to DefectDojo
        run: |
          curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=Trivy Scan" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "file=@trivy.json"
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_PRODUCT: ${{ secrets.DD_PRODUCT }}
          DD_ENGAGEMENT: ${{ secrets.DD_ENGAGEMENT }}


# =====================================================
# SCA - DEPENDENCY CHECK
# =====================================================
  dependency-check:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          format: XML
          out: dependency-check
        continue-on-error: true
      - name: Debug files
        run: ls -R

      - name: Upload Dependency Check to DefectDojo
        run: |
          curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=Dependency Check Scan" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "file=@dependency-check/dependency-check-report.xml"
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_PRODUCT: ${{ secrets.DD_PRODUCT }}
          DD_ENGAGEMENT: ${{ secrets.DD_ENGAGEMENT }}


# =====================================================
# DAST - OWASP ZAP
# =====================================================
  zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Run Application Container
        run: |
          docker run -d -p 3000:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/duolingo-mobelite:latest

      - name: Wait for app
        run: sleep 30

      - name: Run ZAP Baseline Scan
        run: |
          docker run --network host \
            -v $(pwd):/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -x zap.xml || true

      - name: Upload ZAP to DefectDojo
        run: |
          curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=ZAP Scan" \
            -F "product_name=$DD_PRODUCT" \
            -F "engagement_name=$DD_ENGAGEMENT" \
            -F "file=@zap.xml"
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_PRODUCT: ${{ secrets.DD_PRODUCT }}
          DD_ENGAGEMENT: ${{ secrets.DD_ENGAGEMENT }}
